.stat.venter .tall{color:#ffff00;}
.stat.lost .tall{color:#00ff00;}

.filterbtn.aktiv{background:#00ffff;color:#000;border-color:#00ffff;}
.avvik{border:2px solid #333;margin-bottom:14px;padding:16px;position:relative;}
.avvik.sev-hoy{border-left:6px solid #ff0000;}
.avvik.sev-middels{border-left:6px solid #ffaa00;}
.avvik.sev-lav{border-left:6px solid #666;}
.avvik-topp{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:8px;}
.avvik-id{color:#00ffff;font-size:0.85em;}
.avvik-tittel{font-size:1.05em;font-weight:700;color:#fff;margin:2px 0 6px;}
.badge{display:inline-block;padding:4px 10px;font-size:0.75em;font-weight:700;text-transform:uppercase;border:1px solid;white-space:nowrap;}
.badge.apen{color:#ff6b6b;border-color:#ff6b6b;background:#330000;}
.badge.venter{color:#ffff00;border-color:#ffff00;background:#332b00;}
.badge.lost{color:#00ff00;border-color:#00ff00;background:#002200;}
.badge.kjent{color:#aaa;border-color:#666;background:#1a1a1a;}
.meta{font-size:0.8em;color:#999;margin-bottom:8px;}
.meta span{margin-right:16px;}
.felt-lbl{color:#00ffff;font-size:0.75em;text-transform:uppercase;margin-top:8px;}
.felt-innhold{font-size:0.9em;color:#ddd;margin-top:2px;line-height:1.4;}

function badgeInfo(status) {
  if (status === 'apen') return { klasse: 'apen', tekst: 'Åpen' };
  if (status === 'venter') return { klasse: 'venter', tekst: 'Rettet i kode - venter på distribusjon' };
  if (status === 'lost') return { klasse: 'lost', tekst: 'Løst og verifisert' };
  return { klasse: 'kjent', tekst: 'Kjent begrensning (ikke rettet)' };
}

function sevKlasse(a) {
  if (a === 'hoy') return 'sev-hoy';
  if (a === 'middels') return 'sev-middels';
  return 'sev-lav';
}
function sevTekst(a) {
  if (a === 'hoy') return 'Høy alvorlighet';
  if (a === 'middels') return 'Middels alvorlighet';
  return 'Lav alvorlighet';
}

var aktivtFilter = 'alle';

function tegnStats() {
  var apen = AVVIK_DATA.filter(function (a) { return a.status === 'apen'; }).length;
  var venter = AVVIK_DATA.filter(function (a) { return a.status === 'venter'; }).length;
  var lost = AVVIK_DATA.filter(function (a) { return a.status === 'lost'; }).length;
  var kjent = AVVIK_DATA.filter(function (a) { return a.status === 'kjent'; }).length;
  document.getElementById('stats').innerHTML =
    '<div class="stat apen"><div class="tall">' + apen + '</div><div class="lbl">Åpne</div></div>' +
    '<div class="stat venter"><div class="tall">' + venter + '</div><div class="lbl">Venter på distribusjon</div></div>' +
    '<div class="stat lost"><div class="tall">' + lost + '</div><div class="lbl">Løst og verifisert</div></div>' +
    '<div class="stat kjent"><div class="tall">' + kjent + '</div><div class="lbl">Kjente begrensninger</div></div>' +
    '<div class="stat"><div class="tall">' + AVVIK_DATA.length + '</div><div class="lbl">Totalt</div></div>';

  var filtre = [
    { key: 'alle', navn: 'Alle (' + AVVIK_DATA.length + ')' },
    { key: 'apen', navn: 'Åpne (' + apen + ')' },
    { key: 'venter', navn: 'Venter på distribusjon (' + venter + ')' },
    { key: 'lost', navn: 'Løst (' + lost + ')' },
    { key: 'kjent', navn: 'Kjente begrensninger (' + kjent + ')' }
  ];
  document.getElementById('filterrow').innerHTML = filtre.map(function (f) {
    return '<button class="filterbtn' + (aktivtFilter === f.key ? ' aktiv' : '') + '" onclick="settFilter(\'' + f.key + '\')">' + f.navn + '</button>';
  }).join('');
}

function settFilter(f) {
  aktivtFilter = f;
  tegnStats();
  tegnListe();
}

// Avviksteksten inneholder kodeeksempler. Uten escaping ble de tolket som
// markup - en beskrivelse av selve XSS-avviket (AVVIK-012) kjorte faktisk
// i denne siden da den ble lagt inn.
function e(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function tegnListe() {
  var data = AVVIK_DATA.slice().sort(function (a, b) {
    var rekkefolge = { apen: 0, venter: 1, kjent: 2, lost: 3 };
    return rekkefolge[a.status] - rekkefolge[b.status];
  });
  if (aktivtFilter !== 'alle') {
    data = data.filter(function (a) { return a.status === aktivtFilter; });
  }
  var html = data.map(function (a) {
    var b = badgeInfo(a.status);
    return '<div class="avvik ' + sevKlasse(a.alvorlighet) + '">' +
      '<div class="avvik-topp">' +
        '<div><span class="avvik-id">' + e(a.id) + '</span><div class="avvik-tittel">' + e(a.tittel) + '</div></div>' +
        '<span class="badge ' + b.klasse + '">' + b.tekst + '</span>' +
      '</div>' +
      '<div class="meta"><span>' + sevTekst(a.alvorlighet) + '</span><span>Område: ' + e(a.omrade) + '</span><span>Funnet: ' + e(a.funnetDato) + '</span></div>' +
      '<div class="felt-lbl">Beskrivelse</div><div class="felt-innhold">' + e(a.beskrivelse) + '</div>' +
      '<div class="felt-lbl">Funnet av</div><div class="felt-innhold">' + e(a.funnetAv) + '</div>' +
      '<div class="felt-lbl">Løsning / status</div><div class="felt-innhold">' + e(a.losning) + '</div>' +
      '<div class="oppdatert">Sist oppdatert: ' + e(a.sistOppdatert) + '</div>' +
    '</div>';
  }).join('');
  document.getElementById('liste').innerHTML = html || '<div class="card"><p>Ingen avvik i denne kategorien.</p></div>';
}

tegnStats();
tegnListe();
