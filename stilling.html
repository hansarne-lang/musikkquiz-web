<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Musikkquiz - Stilling</title>
<style>
:root{
  --bg:#000000;
  --bg2:#000000;
  --bg3:#000000;
  --accent:#00ffff;
  --accent2:#ffff00;
  --gold:#ffff00;
  --card:#000000;
  --text:#ffffff;
}
* {box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--bg);font-family:'Courier New',Courier,monospace;color:var(--text);letter-spacing:0.5px;}
h1,h2,h3{font-weight:700;margin:0 0 12px;text-transform:uppercase;letter-spacing:1px;}
h1{color:#ffff00;background:#0000aa;padding:8px 14px;display:inline-block;border:2px solid #ffffff;}
h2{color:#00ffff;}
h3{color:#00ff00;}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
.card{background:var(--card);border:2px solid var(--accent);border-radius:0;padding:20px;margin-bottom:20px;}
input,select{background:#000000;border:2px solid var(--accent2);color:var(--text);border-radius:0;padding:8px 10px;font-size:15px;font-family:'Courier New',Courier,monospace;}
table{width:100%;border-collapse:collapse;}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--accent);}
th{background:#0000aa;color:#ffff00;text-transform:uppercase;}
button{background:var(--accent2);border:2px solid #ffffff;color:#000000;font-weight:700;padding:12px 20px;border-radius:0;cursor:pointer;font-size:15px;font-family:'Courier New',Courier,monospace;text-transform:uppercase;box-shadow:none;}
button:hover{background:#00ff00;filter:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:16px;}
.qrcard{background:#ffffff;color:#000000;border-radius:0;border:3px solid #00ffff;padding:12px;text-align:center;}
.qrcard h3{color:#111;margin-bottom:4px;}
.small{font-size:11px;word-break:break-all;color:#00ff00;}
@media print{body{background:#fff;color:#000;} .card,button{display:none;}}

table{width:100%;border-collapse:collapse;}
th,td{padding:6px 10px;text-align:left;}
tr:nth-child(even){background:rgba(0,255,255,0.08);}
@keyframes poengFloat{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-22px) scale(1.4);}}
.poeng-anim{display:inline-block;color:#00ff00;font-weight:bold;margin-left:8px;animation:poengFloat 1.8s ease-out forwards;}
</style>
</head>
<body>
<div class="wrap">
<h1>Musikkquiz - Stilling</h1>
<div class="card" style="display:flex;gap:10px;flex-wrap:wrap;">
<a href="index.html"><button>Oversikt</button></a>
<a href="stilling.html"><button style="background:#00ffff;">Stilling</button></a>
<a href="styre.html"><button>Styre / Admin</button></a>
<a href="historikk.html"><button>Historikk</button></a>
<a href="hovedskjerm.html"><button>Hovedskjerm</button></a>
<a href="veiledning.html"><button>Veiledning</button></a>
</div>
<div id="app"><p>Laster...</p></div>
</div>
<script>
var API_BASE = "https://script.google.com/macros/s/AKfycbzrbI15cIHxU_ccXhcriPwGwuksnPs2K5DDPTCHxhVrur-vU3KEpIiGbPnazh-K6i0rzQ/exec";

function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function last() {
  fetch(API_BASE + "?api=stilling")
    .then(function(res) { return res.json(); })
    .then(vis)
    .catch(function(err) {
      document.getElementById('app').innerHTML = '<p>Klarte ikke å hente stilling. Prøver igjen om litt...</p>';
      console.error(err);
    });
}

// Sesongen kommer fra backend (AKTIV_SESONG), runden er den som er apen naa.
// Er runden 0, staar vi mellom to runder - da er opp-/nedrykket i gang.
function sesongOgRunde(data) {
  var s = data.sesong ? 'Sesong ' + escHtml(data.sesong) : '';
  var r = Number(data.runde);
  var rt = (r >= 1 && r <= 6) ? 'Runde ' + r + ' av 6'
         : (r === 0 ? 'Mellom rundene' : 'Runde ' + escHtml(data.runde));
  return (s ? s + ' \u00b7 ' : '') + rt;
}

function vis(data) {
  var html = '<p style="font-size:1.2em;color:#00ffff;letter-spacing:1px;">' + sesongOgRunde(data) + '</p>' +
    '<div class="card"><h2>1. divisjon</h2>' + lagTabell(data.div1, 1) + '</div>' +
    '<div class="card"><h2>2. divisjon</h2>' + lagTabell(data.div2, 2) + '</div>' +
    '<div class="card" style="font-size:0.85em;">' +
    '<span style="background:#00cc00;color:#000;padding:2px 8px;font-weight:bold;">&nbsp;&nbsp;</span> 1. plass &nbsp;&nbsp; ' +
    '<span style="background:#ffff00;color:#000;padding:2px 8px;font-weight:bold;">&nbsp;&nbsp;</span> Med i opp-/nedrykk-trekning<br>' +
    '<span>"Svart" viser hvor mange sanger laget totalt har sendt inn svar på</span>' +
    '</div>';
  document.getElementById('app').innerHTML = html;
}

var forrigePoeng = {};

function lagTabell(rader, divisjon) {
  var html = '<table><tr><th>Plass</th><th>Lag</th><th>Bord</th><th>Poeng</th><th>Svart</th></tr>';
  rader.forEach(function(r, i) {
    var stil = '';
    if (i === 0) {
      stil = ' style="background:#00cc00;color:#000000;font-weight:bold;"';
    } else if (divisjon === 1 && rader.length >= 2 && (i === rader.length - 2 || i === rader.length - 1)) {
      stil = ' style="background:#ffff00;color:#000000;font-weight:bold;"';
    } else if (divisjon === 2 && i === 1) {
      stil = ' style="background:#ffff00;color:#000000;font-weight:bold;"';
    }
    var forrige = (r.lagId in forrigePoeng) ? forrigePoeng[r.lagId] : r.poeng;
    var diff = r.poeng - forrige;
    var poengHtml = r.poeng + (diff > 0 ? ' <span class="poeng-anim">+' + diff + '</span>' : '');
    forrigePoeng[r.lagId] = r.poeng;
    html += '<tr' + stil + '><td>' + (i + 1) + '</td><td>' + escHtml(r.navn) + '</td><td>' + escHtml(r.bord) + '</td><td>' + poengHtml + '</td><td>' + (r.antallSvar || 0) + '</td></tr>';
  });
  html += '</table>';
  return html;
}

last();
setInterval(last, 8000);
</script>
</body>
</html>
