<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Musikkquiz - Trekning</title>
<style>
:root{
  --bg:#000000;
  --bg2:#000000;
  --bg3:#000000;
  --accent:#00ffff;
  --accent2:#ffff00;
  --gold:#ffff00;
  --card:#000000;
  --text:#ffffff;
}
* {box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--bg);font-family:'Courier New',Courier,monospace;color:var(--text);letter-spacing:0.5px;}
h1,h2,h3{font-weight:700;margin:0 0 12px;text-transform:uppercase;letter-spacing:1px;}
h1{color:#ffff00;background:#0000aa;padding:8px 14px;display:inline-block;border:2px solid #ffffff;}
h2{color:#00ffff;}
h3{color:#00ff00;}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
.card{background:var(--card);border:2px solid var(--accent);border-radius:0;padding:20px;margin-bottom:20px;}
button{background:var(--accent2);border:2px solid #ffffff;color:#000000;font-weight:700;padding:12px 20px;border-radius:0;cursor:pointer;font-size:15px;font-family:'Courier New',Courier,monospace;text-transform:uppercase;box-shadow:none;}
button:hover{background:#00ff00;filter:none;}
button:disabled{background:#666;color:#ccc;cursor:default;}
.small{font-size:11px;word-break:break-all;color:#00ff00;}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:28px 0;}
.tile{background:rgba(0,255,255,0.15);border-radius:0;padding:14px 18px;font-size:1.05em;font-weight:bold;transition:all .45s ease;}
.tile.pending{animation:pulse 1.1s infinite;}
.tile.eliminated{opacity:.12;transform:scale(.8);text-decoration:line-through;filter:grayscale(1);animation:none;}
.tile.winner{background:linear-gradient(135deg,#00ff00,#ffff00);transform:scale(1.18);box-shadow:none;animation:none;}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
.confetti{position:fixed;top:-12px;width:8px;height:8px;border-radius:0;animation:fall linear forwards;z-index:999;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.3;}}
#final{font-size:1.6em;text-align:center;margin-top:20px;}
#wheelStage{position:relative;width:360px;height:360px;margin:20px auto;}
#wheelBulbRing{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3;}
.bulb{position:absolute;width:12px;height:12px;border-radius:50%;background:#332900;box-shadow:0 0 4px rgba(0,0,0,.6) inset;transform:translate(-50%,-50%);}
.bulb.lit{background:#fff6c8;box-shadow:0 0 10px 3px #ffe066,0 0 3px #fff;}
@keyframes bulbChase{0%,100%{background:#332900;box-shadow:0 0 4px rgba(0,0,0,.6) inset;}15%{background:#fff6c8;box-shadow:0 0 10px 3px #ffe066,0 0 3px #fff;}30%{background:#332900;box-shadow:0 0 4px rgba(0,0,0,.6) inset;}}
.bulb.chase{animation:bulbChase 1s linear infinite;}
@keyframes bulbStrobe{0%,100%{background:#332900;box-shadow:0 0 4px rgba(0,0,0,.6) inset;}50%{background:#ffffff;box-shadow:0 0 18px 6px #ffffff;}}
.bulb.strobe{animation:bulbStrobe .18s steps(1) 6;}
#wheelPointer{position:absolute;top:-16px;left:50%;width:0;height:0;transform-origin:50% 8px;transform:translateX(-50%);border-left:26px solid transparent;border-right:26px solid transparent;border-top:44px solid #ffff00;z-index:6;filter:drop-shadow(0 0 8px #ffff00) drop-shadow(0 2px 5px #000);animation:pointerIdle 1.6s ease-in-out infinite;}
@keyframes pointerIdle{0%,100%{transform:translateX(-50%) rotate(0deg);}50%{transform:translateX(-50%) rotate(-6deg);}}
#wheelPointer.bump{animation:pointerBump .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pointerBump{0%{transform:translateX(-50%) rotate(0deg);}30%{transform:translateX(-50%) rotate(20deg);}60%{transform:translateX(-50%) rotate(-12deg);}100%{transform:translateX(-50%) rotate(0deg);}}
#wheelFlash{position:absolute;top:-8px;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);opacity:0;pointer-events:none;z-index:5;}
#wheelFlash.go{animation:flashPop .6s ease-out;}
@keyframes flashPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}25%{opacity:1;transform:translate(-50%,-50%) scale(1.5);}100%{opacity:0;transform:translate(-50%,-50%) scale(2.4);}}
#wheelSvg{width:360px;height:360px;border-radius:50%;border:6px solid #00ffff;background:#000;transform:rotate(0deg);box-shadow:0 0 0 4px #000,0 0 30px rgba(0,255,255,.4);}
#wheelStage.landed{animation:stagePulse .5s ease-out;}
@keyframes stagePulse{0%{transform:scale(1);}30%{transform:scale(1.045);}100%{transform:scale(1);}}
#wheelHub{position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe0,#ffff00 60%,#c9a600 100%);border:3px solid #000;z-index:4;box-shadow:0 0 10px #ffff00;}
#uavgjortResultat div{margin:6px 0;color:#00ff00;}
/* Vinneroverlegget skal ligge over bommerten, ikke omvendt (AVVIK-037). */
#vinnerOverlay{z-index:1600;}
.fullOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.94);z-index:1500;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;}
.vinnerBoks h1{color:#ffff00;font-size:2.2em;margin-bottom:20px;}
.vinnerBoks h2{color:#00ff00;font-size:3.2em;margin:0;}
.bommertBoks{background:#110022;border:4px solid #ff00ff;padding:40px 60px;max-width:85%;}
.bommertBoks h2{color:#ff00ff;font-size:2em;}
.bommertLag{font-size:1.9em;color:#ffff00;font-weight:bold;margin:10px 0;}
.bommertSang{font-size:1.2em;color:#00ffff;font-style:italic;margin:6px 0;}
.bommertSvar{font-size:1.4em;color:#ff6b6b;margin:6px 0;}
.bommertFasit{font-size:1.4em;color:#00ff00;margin:6px 0;}
</style>
</head>
<body>
<div id="vinnerOverlay" class="fullOverlay" style="display:none;"></div>
<div id="bommertOverlay" class="fullOverlay" style="display:none;"></div>
<div class="wrap">
<div class="card" style="display:flex;gap:10px;flex-wrap:wrap;">
<a href="index.html"><button>Oversikt</button></a>
<a href="stilling.html"><button>Stilling</button></a>
<a href="styre.html"><button>Styre / Admin</button></a>
<a href="historikk.html"><button>Historikk</button></a>
<a href="hovedskjerm.html"><button>Hovedskjerm</button></a>
<a href="veiledning.html"><button>Veiledning</button></a>
</div>

<div id="trekningWrap">
<h1>Kategori-trekning</h1>
<div class="card" id="trekkKontroll">
<button id="startBtn" onclick="start()" disabled>Start trekning</button>
<button id="nullstillBtn" onclick="nullstillTrekning()" style="background:#ff0000;color:#fff;">Nullstill opp-/nedrykk</button>
<p class="small" id="trekkInfo"></p>
</div>
<div id="app"><p>Laster...</p></div>
<div class="card">
<h2>Kategorier</h2>
<p style="font-size:.85em;opacity:.7">Kryss av kategorier som er brukt for å utelate dem fra trekningen.</p>
<div id="katliste"><p>Laster...</p></div>
</div>
</div>

<div id="buzzerWrap" style="display:none;text-align:center;">
<div id="buzzerLedig" class="card" style="padding:60px 20px;"><h1 style="font-size:2.5em;color:#888;">Venter...</h1></div>
<div id="buzzerApen" class="card" style="display:none;padding:60px 20px;background:#2ecc71;"><h1 style="font-size:4em;color:#fff;">BUZZER ÅPEN!</h1></div>
<div id="buzzerLukket" class="card" style="display:none;padding:60px 20px;background:#ff0000;">
<h2 style="font-size:2em;color:#fff;margin-bottom:10px;">Først til å trykke:</h2>
<h1 id="buzzerVinnernavn" style="font-size:4.5em;color:#fff;"></h1>
</div>
</div>

<div id="uavgjortWrap" style="display:none;text-align:center;">
<div class="card">
<h1 style="color:#ff00ff;">LYKKEHJULET</h1>
<p id="uavgjortLabel" style="font-size:1.2em;"></p>
</div>
<div class="card" style="padding:40px 20px;">
<div id="wheelStage">
<div id="wheelBulbRing"></div>
<div id="wheelPointer"></div>
<div id="wheelFlash"></div>
<div id="wheelHub"></div>
<svg id="wheelSvg" viewBox="0 0 300 300"></svg>
</div>
<div style="margin-top:10px;">
<button id="spinBtn" onclick="spinWheel()">Drei hjulet!</button>
</div>
<div id="uavgjortResultat" style="margin-top:20px;font-size:1.6em;"></div>
</div>
</div>
</div>
<script>
var API_BASE = "https://script.google.com/macros/s/AKfycbzrbI15cIHxU_ccXhcriPwGwuksnPs2K5DDPTCHxhVrur-vU3KEpIiGbPnazh-K6i0rzQ/exec";

function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function apiGet(action, extraParams) {
  var url = API_BASE + "?api=" + action;
  if (extraParams) {
    Object.keys(extraParams).forEach(function(k) {
      url += "&" + k + "=" + encodeURIComponent(extraParams[k]);
    });
  }
  return fetch(url).then(function(res) { return res.json(); }).then(function(data) {
    if (data && data.error) { throw new Error(data.error); }
    return data;
  });
}

var allNames = [];
var tileEls = {};
var katListeIntervalId = null;

function initTrekning() {
  // Kategorinavnene maa vaere pa plass foer visStatus kaller renderGrid, ellers
  // blir rutenettet staaende tomt naar kategorikallet er tregest (AVVIK-031).
  apiGet('alleKategoriNavn')
    .then(function (n) { allNames = n; })
    .catch(function (e) { console.error(e); })
    .then(function () { return apiGet('opprykkStatus').then(visStatus); })
    .catch(function (e) { console.error(e); });
  lastKatListe();
  if (katListeIntervalId) clearInterval(katListeIntervalId);
  katListeIntervalId = setInterval(lastKatListe, 5000);
}

function lastKatListe() {
  apiGet('kategoriStatusListe').then(visKatListe).catch(function(e) { console.error(e); });
}

function visKatListe(liste) {
  var wrap = document.getElementById('katliste');
  wrap.innerHTML = '';
  liste.forEach(function(k) {
    var lab = document.createElement('label');
    lab.style.display = 'inline-block';
    lab.style.width = '220px';
    lab.style.margin = '4px';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!k.brukt;
    cb.onchange = function() { apiGet('setKategoriBrukt', { navn: k.navn, brukt: cb.checked }).catch(function(e) { console.error(e); }); };
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(' ' + k.navn));
    wrap.appendChild(lab);
  });
  if (!liste.length) wrap.innerHTML = '<p>Ingen kategorier funnet.</p>';
}

function visStatus(o) {
  var startBtn = document.getElementById('startBtn');
  var info = document.getElementById('trekkInfo');
  if (o.status === 'trekker') {
    startBtn.disabled = false;
    info.innerHTML = 'Lag som trekker kategori: <b>' + escHtml(o.lagA.navn) + '</b>';
    document.getElementById('app').innerHTML = '<div class="grid" id="grid"></div><div id="final"></div>';
    renderGrid();
  } else if (o.status === 'velger') {
    startBtn.disabled = true;
    info.innerHTML = '';
    var html = '<div class="card"><h2>Kategoriene er trukket</h2><ul style="font-size:1.4em">';
    o.kandidater.forEach(function(k) { html += '<li>' + k + '</li>'; });
    html += '</ul><p>Gå til Styre-siden for å velge kategori.</p></div>';
    document.getElementById('app').innerHTML = html;
  } else {
    startBtn.disabled = true;
    info.innerHTML = '';
    document.getElementById('app').innerHTML = '<div class="card"><p>Ingen trekning pågår akkurat nå.</p></div>';
  }
}

function nullstillTrekning() {
  if (!confirm('Nullstille trekningen og trekke kategorier på nytt? Lagene og poengene beholdes.')) return;
  var btn = document.getElementById('nullstillBtn');
  btn.disabled = true;
  btn.textContent = 'Nullstiller...';
  apiGet('resetTrekningTilStart').then(function() { location.reload(); }).catch(function(e) { console.error(e); btn.disabled = false; btn.textContent = 'Nullstill opp-/nedrykk'; });
}

function renderGrid() {
  var grid = document.getElementById('grid');
  if (!grid) return;
  grid.innerHTML = '';
  tileEls = {};
  allNames.forEach(function(name) {
    var d = document.createElement('div');
    d.className = 'tile pending';
    d.textContent = name;
    grid.appendChild(d);
    tileEls[name] = d;
  });
}

function start() {
  var btn = document.getElementById('startBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Trekker...'; }
  apiGet('trekkKategorier').then(function(o) { eliminate(o.kandidater); }).catch(function(e) { console.error(e); });
}

var actx = null;
function actxGet() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function beep(freq, dur, type, vol) {
  try {
    var a = actxGet();
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = vol || .2;
    o.connect(g); g.connect(a.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
    o.stop(a.currentTime + dur + .03);
  } catch (e) {}
}

function eliminate(winners) {
  if (!allNames.length) { setTimeout(function() { eliminate(winners); }, 200); return; }
  var losers = allNames.filter(function(n) { return winners.indexOf(n) === -1; });
  for (var i = losers.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = losers[i]; losers[i] = losers[j]; losers[j] = t; }
  var totalMs = 9000; var stepMs = Math.max(220, Math.floor(totalMs / Math.max(losers.length, 1)));
  var idx = 0;
  function step() {
    if (idx < losers.length) {
      var el = tileEls[losers[idx]];
      if (el) { el.classList.remove('pending'); el.classList.add('eliminated'); }
      beep(170, .1, 'square', .12);
      idx++;
      setTimeout(step, stepMs);
    } else {
      setTimeout(function() { revealWinners(winners); }, 600);
    }
  }
  step();
}

function revealWinners(winners) {
  var notes = [523, 659, 784, 988];
  winners.forEach(function(name, i) {
    setTimeout(function() {
      var el = tileEls[name];
      if (el) { el.classList.remove('pending'); el.classList.add('winner'); }
      beep(notes[i % 4], .28, 'sine', .28);
      if (i === winners.length - 1) {
        setTimeout(function() {
          [523, 659, 784, 1046].forEach(function(f, k) { setTimeout(function() { beep(f, .3, 'triangle', .3); }, k * 150); });
          confetti();
          var f = document.getElementById('final');
          if (f) f.innerHTML = '<p><b>Kategoriene er trukket!</b> Gå til Styre-siden for å velge kategori.</p>';
        }, 400);
      }
    }, i * 550);
  });
}

function confetti() {
  var colors = ['#00ff00', '#ffff00', '#ffd23f', '#3a86ff', '#ffffff'];
  for (var i = 0; i < 50; i++) {
    (function() {
      var d = document.createElement('div');
      d.className = 'confetti';
      d.style.left = (Math.random() * 100) + 'vw';
      d.style.background = colors[Math.floor(Math.random() * colors.length)];
      d.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(d);
      setTimeout(function() { d.remove(); }, 4200);
    })();
  }
}

var buzzerIntervalId = null;
function initBuzzer() {
  lastBuzzerDisplay();
  if (buzzerIntervalId) clearInterval(buzzerIntervalId);
  buzzerIntervalId = setInterval(lastBuzzerDisplay, 700);
}
function lastBuzzerDisplay() {
  apiGet('buzzerStatus').then(visBuzzerDisplay).catch(function(e) { console.error(e); });
}
function visBuzzerDisplay(o) {
  document.getElementById('buzzerLedig').style.display = (o.status === 'ledig') ? 'block' : 'none';
  document.getElementById('buzzerApen').style.display = (o.status === 'apen') ? 'block' : 'none';
  document.getElementById('buzzerLukket').style.display = (o.status === 'lukket') ? 'block' : 'none';
  if (o.status === 'lukket') { document.getElementById('buzzerVinnernavn').textContent = o.vinnerNavn || ''; }
}

var gjeldendeModus = null;
function sjekkModus() {
  apiGet('uavgjortStatus').then(function(u) {
    if (u.status === 'venter' || u.status === 'trukket') {
      var key = u.kontekst + '|' + u.type + '|' + u.status;
      if (gjeldendeModus !== 'uavgjort') {
        gjeldendeModus = 'uavgjort';
        document.getElementById('trekningWrap').style.display = 'none';
        document.getElementById('buzzerWrap').style.display = 'none';
        document.getElementById('uavgjortWrap').style.display = 'block';
        if (buzzerIntervalId) { clearInterval(buzzerIntervalId); buzzerIntervalId = null; }
        if (katListeIntervalId) { clearInterval(katListeIntervalId); katListeIntervalId = null; }
        lastUavgjortKey = key;
        initUavgjort(u);
      } else if (key !== lastUavgjortKey && !wheelSpinning) {
        lastUavgjortKey = key;
        initUavgjort(u);
      }
      return;
    }
    apiGet('opprykkStatus').then(function(o) {
      var skalViseTrekning = (o.status === 'trekker' || o.status === 'velger');
      var nyModus = skalViseTrekning ? 'trekning' : 'buzzer';
      if (nyModus !== gjeldendeModus) {
        gjeldendeModus = nyModus;
        document.getElementById('trekningWrap').style.display = skalViseTrekning ? 'block' : 'none';
        document.getElementById('buzzerWrap').style.display = skalViseTrekning ? 'none' : 'block';
        document.getElementById('uavgjortWrap').style.display = 'none';
        if (skalViseTrekning) {
          if (buzzerIntervalId) { clearInterval(buzzerIntervalId); buzzerIntervalId = null; }
          initTrekning();
        } else {
          if (katListeIntervalId) { clearInterval(katListeIntervalId); katListeIntervalId = null; }
          initBuzzer();
        }
      }
    }).catch(function(e) { console.error(e); });
  }).catch(function(e) { console.error(e); });
}

// ---- Lykkehjul (uavgjort-trekning) ----
var WHEEL_COLORS = ['#ff00ff', '#00ffff', '#ffff00', '#00ff00', '#ff6b6b', '#3a86ff', '#ffa500', '#ff1493'];
var WHEEL_SPIN_MS = 7000;
var WHEEL_OVERSHOOT_DEG = 7;
var WHEEL_BOUNCE_MS = 420;
var wheelKandidater = [];
var wheelRotation = 0;
var wheelSpinning = false;
var lastUavgjortKey = '';
var uavgjortWinnersQueue = [];
var KLUBB_LOGO_MAP = null;
var KLUBB_LOGO_BASE = "https://raw.githubusercontent.com/hansarne-lang/musikkquiz-web/main/klubbdata/";

function lastKlubbLogoMap() {
  if (KLUBB_LOGO_MAP) return Promise.resolve(KLUBB_LOGO_MAP);
  return apiGet('klubbListe').then(function (liste) {
    var map = {};
    (liste || []).forEach(function (k) { map[String(k.navn).toLowerCase().trim()] = k.slug; });
    KLUBB_LOGO_MAP = map;
    return map;
  }).catch(function (e) {
    console.error(e); KLUBB_LOGO_MAP = null; return {};
  });
}

function polarToCartesian(cx, cy, r, angleDeg) {
  var rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function describeSlice(cx, cy, r, startAngle, endAngle) {
  var start = polarToCartesian(cx, cy, r, endAngle);
  var end = polarToCartesian(cx, cy, r, startAngle);
  var largeArc = (endAngle - startAngle) <= 180 ? '0' : '1';
  return ['M', cx, cy, 'L', start.x, start.y, 'A', r, r, 0, largeArc, 0, end.x, end.y, 'Z'].join(' ');
}

function buildWheel(kandidater) {
  var svg = document.getElementById('wheelSvg');
  svg.innerHTML = '';
  svg.style.transition = 'none';
  svg.style.transform = 'rotate(0deg)';
  var n = kandidater.length;
  if (!n) return;
  var cx = 150, cy = 150, r = 148;
  var sliceAngle = 360 / n;
  var logoMap = KLUBB_LOGO_MAP || {};
  var logoR = n <= 4 ? 30 : n <= 6 ? 24 : n <= 10 ? 18 : 13;
  var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  svg.appendChild(defs);
  for (var i = 0; i < n; i++) {
    var start = i * sliceAngle;
    var end = start + sliceAngle;
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', describeSlice(cx, cy, r, start, end));
    path.setAttribute('fill', WHEEL_COLORS[i % WHEEL_COLORS.length]);
    path.setAttribute('stroke', '#000');
    path.setAttribute('stroke-width', '2');
    svg.appendChild(path);
    var midAngle = start + sliceAngle / 2;
    var slug = logoMap[String(kandidater[i].navn || '').toLowerCase().trim()];
    if (slug) {
      var logoPos = polarToCartesian(cx, cy, r * 0.66, midAngle);
      var clipId = 'wheelclip' + i;
      var clipPath = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
      clipPath.setAttribute('id', clipId);
      var clipCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      clipCircle.setAttribute('cx', logoPos.x);
      clipCircle.setAttribute('cy', logoPos.y);
      clipCircle.setAttribute('r', logoR);
      clipPath.appendChild(clipCircle);
      defs.appendChild(clipPath);
      var bg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      bg.setAttribute('cx', logoPos.x);
      bg.setAttribute('cy', logoPos.y);
      bg.setAttribute('r', logoR + 3);
      bg.setAttribute('fill', '#ffffff');
      bg.setAttribute('stroke', '#000');
      bg.setAttribute('stroke-width', '1.5');
      svg.appendChild(bg);
      var img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
      img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', KLUBB_LOGO_BASE + slug + '_logo.jpg');
      img.setAttribute('href', KLUBB_LOGO_BASE + slug + '_logo.jpg');
      img.setAttribute('x', logoPos.x - logoR);
      img.setAttribute('y', logoPos.y - logoR);
      img.setAttribute('width', logoR * 2);
      img.setAttribute('height', logoR * 2);
      img.setAttribute('preserveAspectRatio', 'xMidYMid slice');
      img.setAttribute('clip-path', 'url(#' + clipId + ')');
      (function (bgEl) { img.addEventListener('error', function () { this.style.display = 'none'; bgEl.style.display = 'none'; }); })(bg);
      svg.appendChild(img);
      var namePos = polarToCartesian(cx, cy, r * 0.90, midAngle);
      var text2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text2.setAttribute('x', namePos.x);
      text2.setAttribute('y', namePos.y);
      text2.setAttribute('fill', '#000');
      text2.setAttribute('font-family', 'Courier New, monospace');
      text2.setAttribute('font-weight', 'bold');
      text2.setAttribute('font-size', n > 8 ? '7' : '9');
      text2.setAttribute('text-anchor', 'middle');
      text2.setAttribute('dominant-baseline', 'middle');
      text2.setAttribute('transform', 'rotate(' + midAngle + ' ' + namePos.x + ' ' + namePos.y + ')');
      text2.textContent = kandidater[i].navn;
      svg.appendChild(text2);
    } else {
      var labelPos = polarToCartesian(cx, cy, r * 0.62, midAngle);
      var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', labelPos.x);
      text.setAttribute('y', labelPos.y);
      text.setAttribute('fill', '#000');
      text.setAttribute('font-family', 'Courier New, monospace');
      text.setAttribute('font-weight', 'bold');
      text.setAttribute('font-size', n > 8 ? '9' : '13');
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'middle');
      text.setAttribute('transform', 'rotate(' + midAngle + ' ' + labelPos.x + ' ' + labelPos.y + ')');
      text.textContent = kandidater[i].navn;
      svg.appendChild(text);
    }
  }
  void svg.offsetWidth;
  svg.style.transition = 'transform ' + (WHEEL_SPIN_MS / 1000) + 's cubic-bezier(0.12,0.67,0.1,1)';
}

// ---- Lyskrans ----
var bulbEls = [];
function initBulbRing() {
  var stage = document.getElementById('wheelStage');
  var ring = document.getElementById('wheelBulbRing');
  if (!stage || !ring) return;
  ring.innerHTML = '';
  bulbEls = [];
  var size = stage.offsetWidth || 360;
  var count = Math.max(18, Math.round(size / 20));
  var cx = size / 2, cy = size / 2;
  var rr = size / 2 + Math.max(10, size * 0.035);
  var bulbSize = Math.max(8, Math.round(size / 32));
  for (var i = 0; i < count; i++) {
    var angle = (360 / count) * i;
    var pos = polarToCartesian(cx, cy, rr, angle);
    var b = document.createElement('div');
    b.className = 'bulb';
    b.style.width = bulbSize + 'px';
    b.style.height = bulbSize + 'px';
    b.style.left = pos.x + 'px';
    b.style.top = pos.y + 'px';
    ring.appendChild(b);
    bulbEls.push(b);
  }
}
function setBulbsChasing(on) {
  bulbEls.forEach(function (b, i) {
    if (on) {
      b.classList.remove('lit', 'strobe');
      b.classList.add('chase');
      b.style.animationDelay = (-(i / bulbEls.length)) + 's';
    } else {
      b.classList.remove('chase');
    }
  });
}
function bulbsLandCelebrate() {
  bulbEls.forEach(function (b, i) {
    b.classList.remove('chase');
    setTimeout(function () {
      b.classList.add('strobe');
      setTimeout(function () { b.classList.remove('strobe'); b.classList.add('lit'); }, 1150);
    }, (i % 6) * 25);
  });
}
function bulbsReset() {
  bulbEls.forEach(function (b) { b.classList.remove('chase', 'strobe', 'lit'); });
}

function landImpact() {
  var stage = document.getElementById('wheelStage');
  var pointer = document.getElementById('wheelPointer');
  var flash = document.getElementById('wheelFlash');
  if (stage) { stage.classList.remove('landed'); void stage.offsetWidth; stage.classList.add('landed'); }
  if (pointer) {
    pointer.classList.remove('bump'); void pointer.offsetWidth; pointer.classList.add('bump');
    setTimeout(function () { pointer.classList.remove('bump'); }, 520);
  }
  if (flash) { flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); }
  beep(120, .15, 'square', .25);
}

function initUavgjort(u) {
  document.getElementById('uavgjortLabel').textContent = u.label || '';
  document.getElementById('uavgjortResultat').innerHTML = '';
  wheelKandidater = (u.kandidater || []).slice();
  wheelRotation = 0;
  wheelSpinning = false;
  bulbsReset();
  lastKlubbLogoMap().then(function () {
    buildWheel(wheelKandidater);
    initBulbRing();
  });
  var spinBtn = document.getElementById('spinBtn');
  if (u.status === 'trukket') {
    spinBtn.style.display = 'none';
    var resHtml = '';
    (u.valgt || []).forEach(function (v) { resHtml += '<div>Vinner: ' + escHtml(v.navn) + '</div>'; });
    resHtml += '<p style="font-size:.5em;opacity:.7;margin-top:10px;">Trukket - venter på bekreftelse fra Styre-siden.</p>';
    document.getElementById('uavgjortResultat').innerHTML = resHtml;
  } else {
    spinBtn.style.display = 'inline-block';
    spinBtn.disabled = false;
  }
}

function tickSoundsDuring(durationMs) {
  var elapsed = 0;
  var interval = 80;
  function tick() {
    if (elapsed >= durationMs - 300) return;
    beep(300 + Math.random() * 80, .05, 'square', .1);
    elapsed += interval;
    interval = interval * 1.06;
    setTimeout(tick, interval);
  }
  tick();
}

function beepWinFanfare() {
  [523, 659, 784, 1046].forEach(function (f, k) { setTimeout(function () { beep(f, .3, 'triangle', .3); }, k * 150); });
}

function spinWheel() {
  if (wheelSpinning) return;
  wheelSpinning = true;
  document.getElementById('spinBtn').disabled = true;
  setBulbsChasing(true);
  apiGet('trekkUavgjort').then(function (rad) {
    uavgjortWinnersQueue = (rad.valgt || []).slice();
    spinToNextWinner(rad.kandidater ? rad.kandidater.slice() : wheelKandidater.slice());
  }).catch(function (e) { console.error(e); wheelSpinning = false; document.getElementById('spinBtn').disabled = false; setBulbsChasing(false); });
}

function spinToNextWinner(pool) {
  if (!uavgjortWinnersQueue.length) { finishSpin(); return; }
  var winner = uavgjortWinnersQueue.shift();
  var idx = -1;
  for (var i = 0; i < pool.length; i++) {
    if (String(pool[i].id) === String(winner.id)) { idx = i; break; }
  }
  if (idx === -1) { spinToNextWinner(pool); return; }
  var n = pool.length;
  var sliceAngle = 360 / n;
  var winnerMid = idx * sliceAngle + sliceAngle / 2;
  var fullSpins = 8 + Math.floor(Math.random() * 3);
  var target = wheelRotation - (wheelRotation % 360) + fullSpins * 360 + (360 - winnerMid);
  var overshoot = target + WHEEL_OVERSHOOT_DEG;
  var svg = document.getElementById('wheelSvg');
  svg.style.transition = 'transform ' + (WHEEL_SPIN_MS / 1000) + 's cubic-bezier(0.12,0.67,0.1,1)';
  svg.style.transform = 'rotate(' + overshoot + 'deg)';
  tickSoundsDuring(WHEEL_SPIN_MS);
  setTimeout(function () {
    svg.style.transition = 'transform ' + (WHEEL_BOUNCE_MS / 1000) + 's cubic-bezier(0.34,1.56,0.64,1)';
    svg.style.transform = 'rotate(' + target + 'deg)';
    wheelRotation = target;
    landImpact();
    setTimeout(function () {
      var el = document.getElementById('uavgjortResultat');
      el.innerHTML += '<div>Vinner: ' + escHtml(winner.navn) + '</div>';
      beepWinFanfare();
      if (uavgjortWinnersQueue.length) {
        pool = pool.slice();
        pool.splice(idx, 1);
        setTimeout(function () {
          buildWheel(pool);
          wheelRotation = 0;
          spinToNextWinner(pool);
        }, 1400);
      } else {
        finishSpin();
      }
    }, WHEEL_BOUNCE_MS + 80);
  }, WHEEL_SPIN_MS);
}

function finishSpin() {
  wheelSpinning = false;
  setBulbsChasing(false);
  bulbsLandCelebrate();
  confetti();
  var spinBtn = document.getElementById('spinBtn');
  if (spinBtn) spinBtn.style.display = 'none';
  var el = document.getElementById('uavgjortResultat');
  el.innerHTML += '<p style="font-size:.5em;opacity:.7;margin-top:10px;">Gå til Styre-siden for å bekrefte og fortsette.</p>';
}

// ---- Finalevinner-konfetti og beste bommert (overlegg, uavhengig av modus) ----
var sisteFinaleStatus = null;
var sisteFinaleBStatus = null;
var sisteBommertTid = null;

// Finalen og B-finalen avgjores rett etter hverandre. Uten en ko overskriver
// den andre vinneren den forste umiddelbart, og hovedvinneren vises aldri for
// publikum (AVVIK-037).
var vinnerKo = [];
var vinnerVises = false;

function visVinnerOverlay(navn, hva) {
  vinnerKo.push({ navn: navn, hva: hva });
  nesteVinnerOverlay();
}

function nesteVinnerOverlay() {
  if (vinnerVises || !vinnerKo.length) { return; }
  var v = vinnerKo.shift();
  vinnerVises = true;
  var ov = document.getElementById('vinnerOverlay');
  ov.innerHTML = '<div class="vinnerBoks"><h1>\u{1F3C6} ' + escHtml(v.hva) + ' er avgjort!</h1><h2>' + escHtml(v.navn || '') + ' vant!</h2></div>';
  ov.style.display = 'flex';
  confetti();
  beepWinFanfare();
  setTimeout(function () {
    ov.style.display = 'none';
    vinnerVises = false;
    nesteVinnerOverlay();
  }, 7000);
}

function visBommertOverlay(o) {
  var ov = document.getElementById('bommertOverlay');
  ov.innerHTML = '<div class="bommertBoks"><h2>🤦 Beste bommert</h2>' +
    '<p class="bommertLag">' + (o.lagNavn || '') + '</p>' +
    (o.sangtekst ? '<p class="bommertSang">' + o.sangtekst + '</p>' : '') +
    '<p class="bommertSvar">Svarte: <b>' + (o.deresSvar || '') + '</b></p>' +
    '<p class="bommertFasit">Riktig: <b>' + (o.riktigSvar || '') + '</b></p></div>';
  ov.style.display = 'flex';
}

function skjulBommertOverlay() {
  var ov = document.getElementById('bommertOverlay');
  if (ov) ov.style.display = 'none';
}

function sjekkFinaleOgBommert() {
  apiGet('finaleStatus').then(function (o) {
    if (o.status === 'ferdig' && sisteFinaleStatus !== 'ferdig') {
      visVinnerOverlay(o.vinnerNavn, 'Finalen');
    }
    sisteFinaleStatus = o.status;
  }).catch(function (e) { console.error(e); });
  apiGet('finaleBStatus').then(function (o) {
    if (o.status === 'ferdig' && sisteFinaleBStatus !== 'ferdig') {
      visVinnerOverlay(o.vinnerNavn, 'B-finalen');
    }
    sisteFinaleBStatus = o.status;
  }).catch(function (e) { console.error(e); });
  apiGet('bommertVisning').then(function (o) {
    if (o && o.tid && o.tid !== sisteBommertTid) {
      sisteBommertTid = o.tid;
      visBommertOverlay(o);
    } else if (!o || !o.tid) {
      sisteBommertTid = null;
      skjulBommertOverlay();
    }
  }).catch(function (e) { console.error(e); });
}

sjekkModus();
setInterval(sjekkModus, 3000);
sjekkFinaleOgBommert();
setInterval(sjekkFinaleOgBommert, 3000);
</script>
