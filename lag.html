<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Musikkquiz - Lag</title>
<style>
:root{
  --bg:#000000;
  --bg2:#000000;
  --bg3:#000000;
  --accent:#00ffff;
  --accent2:#ffff00;
  --gold:#ffff00;
  --card:#000000;
  --text:#ffffff;
}
* {box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--bg);font-family:'Courier New',Courier,monospace;color:var(--text);letter-spacing:0.5px;}
h1,h2,h3{font-weight:700;margin:0 0 12px;text-transform:uppercase;letter-spacing:1px;}
h1{color:#ffff00;background:#0000aa;padding:8px 14px;display:inline-block;border:2px solid #ffffff;}
h2{color:#00ffff;}
h3{color:#00ff00;}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
.card{background:var(--card);border:2px solid var(--accent);border-radius:0;padding:20px;margin-bottom:20px;}
input,select{background:#000000;border:2px solid var(--accent2);color:var(--text);border-radius:0;padding:8px 10px;font-size:15px;font-family:'Courier New',Courier,monospace;width:100%;max-width:400px;}
button{background:var(--accent2);border:2px solid #ffffff;color:#000000;font-weight:700;padding:12px 20px;border-radius:0;cursor:pointer;font-size:15px;font-family:'Courier New',Courier,monospace;text-transform:uppercase;box-shadow:none;}
button:hover{background:#00ff00;filter:none;}
button:disabled{background:#666;color:#ccc;cursor:default;}
label{display:inline-block;margin-top:10px;font-size:0.9em;color:#00ffff;}
#buzzknapp{font-size:1.5em;padding:20px 40px;background:#2ecc71;color:#fff;border:none;}
#buzzknapp:disabled{background:#999;color:#fff;}
.jokerlabel{display:flex;align-items:center;gap:8px;background:#221100;border:2px solid #ffa500;padding:10px;margin:10px 0;font-size:0.95em;color:#ffcc66;}
.jokerlabel input{width:auto;max-width:none;height:22px;}
</style>
</head>
<body>
<div class="wrap">
<h1>Musikkquiz - Svar</h1>
<div class="card" style="display:flex;gap:10px;flex-wrap:wrap;">
<a href="index.html"><button>Oversikt</button></a>
<a href="stilling.html"><button>Stilling</button></a>
<a href="veiledning.html"><button>Veiledning</button></a>
</div>
<div id="app"><p>Laster...</p></div>
<div id="buzzerdiv" class="card" style="display:none;text-align:center;">
<button id="buzzknapp" onclick="buzz()">BUZZ!</button>
<p id="buzztekst"></p>
</div>
<div id="opprykkdiv" class="card" style="display:none;border-color:#ffff00;">
<div id="opprykkinnhold"></div>
</div>
</div>
<script>
var API_BASE = "https://script.google.com/macros/s/AKfycbzrbI15cIHxU_ccXhcriPwGwuksnPs2K5DDPTCHxhVrur-vU3KEpIiGbPnazh-K6i0rzQ/exec";
var params = new URLSearchParams(window.location.search);
var teamId = params.get('id') || '';
var currentRunde = 0;

function apiGet(action, extraParams) {
  var url = API_BASE + "?api=" + action;
  if (extraParams) {
    Object.keys(extraParams).forEach(function(k) {
      url += "&" + k + "=" + encodeURIComponent(extraParams[k]);
    });
  }
  return fetch(url).then(function(res) { return res.json(); }).then(function(data) {
    if (data && data.error) { throw new Error(data.error); }
    return data;
  });
}

function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function feil(e) {
  document.getElementById('app').innerHTML = '<div class="card"><p style="color:#ff6b6b">Feil: ' + (e && e.message ? e.message : e) + '</p></div>';
}

function init() {
  if (!teamId) {
    document.getElementById('app').innerHTML = '<div class="card"><p>Mangler lag-id. Sjekk QR-koden/lenken.</p></div>';
    return;
  }
  apiGet('lagData', { id: teamId }).then(function(data) {
    currentRunde = data.runde;
    vis(data);
  }).catch(feil);
}

function finnSvar(liste, nr) {
  for (var i = 0; i < liste.length; i++) {
    if (liste[i].sangNr == nr) return liste[i];
  }
  return null;
}

function vis(data) {
  if (!data.team) {
    document.getElementById('app').innerHTML = '<div class="card"><p>Fant ikke laget. Sjekk QR-koden.</p></div>';
    return;
  }
  var html = '<div class="card"><h2>' + escHtml(data.team.navn) + '</h2><p>Divisjon ' + data.team.divisjon + ' - Bord ' + data.team.bord + '</p><p>Runde ' + data.runde + '</p>' +
    '<button onclick="init()">Oppdater</button></div>';
  if (data.status !== 'apen') {
    html += '<div class="card"><p>Runden er ikke åpen for innsending akkurat nå.</p></div>';
    document.getElementById('app').innerHTML = html;
    return;
  }
  html += '<div class="card"><form id="svarForm">';
  for (var i = 1; i <= 3; i++) {
    var eks = finnSvar(data.svar, i);
    var sendt = !!eks;
    var forrigeSendt = (i === 1) || !!finnSvar(data.svar, i - 1);
    var last = sendt || !forrigeSendt;
    html += '<h3>Sang ' + i + (sendt ? ' <span style="color:#00ff00;">(Sendt)</span>' : '') + '</h3>' +
      '<label>Artist</label><br><input class="artist" data-sang="' + i + '" value="' + (eks ? eks.artist : '') + '"' + (last ? ' disabled' : '') + '><br>' +
      '<label>Låt/tittel</label><br><input class="latt" data-sang="' + i + '" value="' + (eks ? eks.latt : '') + '"' + (last ? ' disabled' : '') + '><br>' +
      '<label>Årstall</label><br><input type="number" class="aar" data-sang="' + i + '" value="' + (eks ? eks.aar : '') + '"' + (last ? ' disabled' : '') + '><br><br>';
    if (sendt) {
      html += '<p style="color:#00ff00;">Svar for sang ' + i + ' er sendt inn.' + (eks.joker ? ' 🃏 Joker brukt!' : '') + '</p>';
    } else if (!forrigeSendt) {
      html += '<button type="button" disabled>Send svar sang ' + i + '</button> <span style="font-size:0.85em;opacity:0.7;">Send sang ' + (i - 1) + ' først</span>';
    } else {
      if (!data.jokerBrukt) {
        html += '<label class="jokerlabel"><input type="checkbox" class="joker" data-sang="' + i + '"> 🃏 Bruk joker på denne sangen (dobler poengsummen HVIS artist, låt og årstall ALLE er riktig - kun 1 gang per sesong)</label>';
      }
      html += '<button type="button" onclick="sendSangInn(' + i + ')">Send svar sang ' + i + '</button>';
    }
    html += '<div id="statusSang' + i + '"></div><hr style="border-color:#00ffff;opacity:0.3;margin:20px 0;">';
  }
  html += '</form></div>';
  document.getElementById('app').innerHTML = html;
}

function sendSangInn(sangNr) {
  var artistEl = document.querySelector('.artist[data-sang="' + sangNr + '"]');
  var lattEl = document.querySelector('.latt[data-sang="' + sangNr + '"]');
  var aarEl = document.querySelector('.aar[data-sang="' + sangNr + '"]');
  var jokerEl = document.querySelector('.joker[data-sang="' + sangNr + '"]');
  var bruktJoker = !!(jokerEl && jokerEl.checked);
  var statusDiv = document.getElementById('statusSang' + sangNr);
  if (bruktJoker && !confirm('Sikker på at dere vil bruke jokeren nå? Dere får kun én joker per sesong, og den dobler poengsummen KUN hvis alle tre felt (artist, låt og årstall) er helt riktig.')) {
    return;
  }
  if (statusDiv) statusDiv.innerHTML = '<p>Sender...</p>';
  apiGet('sendSvarForSang', { lagId: teamId, runde: currentRunde, sangNr: sangNr, artist: artistEl.value, latt: lattEl.value, aar: aarEl.value, joker: bruktJoker }).then(function() {
    init();
  }).catch(function(e) {
    if (statusDiv) statusDiv.innerHTML = '<p style="color:#ff6b6b">Feil: ' + (e && e.message ? e.message : e) + '</p>';
  });
}

// Modus maa pollers. Leses den bare ved sidelast, faar ingen lag BUZZ-knappen
// naar styret bytter til virtuell midt i kvelden (AVVIK-013).
var buzzerPoll = null;
var sisteBuzzerModus = null;

function sjekkBuzzerModus() {
  apiGet('buzzerModus').then(function (o) {
    var virtuell = (o.modus === 'virtuell');
    if (virtuell === (sisteBuzzerModus === 'virtuell') && sisteBuzzerModus !== null) { return; }
    sisteBuzzerModus = virtuell ? 'virtuell' : 'fysisk';
    if (virtuell) {
      if (!buzzerPoll) {
        lastBuzzerLag();
        buzzerPoll = setInterval(lastBuzzerLag, 700);
      }
    } else {
      if (buzzerPoll) { clearInterval(buzzerPoll); buzzerPoll = null; }
      var div = document.getElementById('buzzerdiv');
      if (div) div.style.display = 'none';
    }
  }).catch(function (e) { console.error(e); });
}

function lastBuzzerLag() {
  var g = buzzGenerasjon;
  apiGet('buzzerStatus').then(function (o) { visBuzzerLag(o, g); }).catch(function (e) { console.error(e); });
}

// Settes naar laget selv har buzzet, slik at et pollesvar som ble sendt FOER
// buzzen ikke rekker aa gjore knappen gronn igjen etterpaa (AVVIK-019).
var buzzGenerasjon = 0;

function visBuzzerLag(o, generasjon) {
  if (generasjon !== undefined && generasjon !== buzzGenerasjon) { return; }
  var div = document.getElementById('buzzerdiv');
  var knapp = document.getElementById('buzzknapp');
  var tekst = document.getElementById('buzztekst');
  if (!div) return;
  if (o.status === 'ledig') {
    div.style.display = 'none';
  } else if (o.status === 'apen') {
    div.style.display = 'block';
    knapp.disabled = false;
    knapp.style.background = '#2ecc71';
    tekst.textContent = '';
  } else if (o.status === 'lukket') {
    div.style.display = 'block';
    knapp.disabled = true;
    knapp.style.background = '#999';
    tekst.textContent = (String(o.vinnerId) === String(teamId)) ? 'Dere var først!' : (o.vinnerNavn + ' var først!');
    buzzGenerasjon++;
  }
}

function buzz() {
  var knapp = document.getElementById('buzzknapp');
  if (knapp.disabled) { return; }
  knapp.disabled = true;
  knapp.style.background = '#999';
  buzzGenerasjon++;
  document.getElementById('buzztekst').textContent = 'Sender...';
  apiGet('trykkBuzzer', { lagId: teamId }).then(function (o) {
    visBuzzerLag(o);
  }).catch(function (e) {
    // Uten tilbakemelding tror laget at trykket gikk gjennom (AVVIK-019).
    console.error(e);
    document.getElementById('buzztekst').textContent = 'Fikk ikke sendt - prøv igjen!';
    knapp.disabled = false;
    knapp.style.background = '#2ecc71';
  });
}

function lastOpprykkLag() {
  apiGet('opprykkStatus').then(visOpprykkLag).catch(function(e) { console.error(e); });
}

function visOpprykkLag(o) {
  var div = document.getElementById('opprykkdiv');
  var innhold = document.getElementById('opprykkinnhold');
  if (!div) return;
  var erA = o.lagA && String(o.lagA.id) === String(teamId);
  var erB = o.lagB && String(o.lagB.id) === String(teamId);
  var erC = o.lagC && String(o.lagC.id) === String(teamId);
  if (!erA && !erB && !erC) { div.style.display = 'none'; return; }
  if (o.status === 'trekker') {
    div.style.display = 'block';
    innhold.innerHTML = '<h3>Opp-/nedrykksspill</h3><p>Dere er med i opp-/nedrykksspillet! Venter på at kategoriene trekkes på storskjermen...</p>';
  } else if (o.status === 'velger' && erA) {
    div.style.display = 'block';
    var html = '<h3>Velg kategori!</h3><p>Deres tur til å velge en av disse fire kategoriene:</p>';
    o.kandidater.forEach(function(navn) {
      html += '<button onclick="velgKategoriSelv(\'' + navn.replace(/'/g, "\\'") + '\')" style="margin:4px;">' + navn + '</button>';
    });
    innhold.innerHTML = html;
  } else if (o.status === 'velger') {
    div.style.display = 'block';
    innhold.innerHTML = '<h3>Opp-/nedrykksspill</h3><p>' + o.lagA.navn + ' velger kategori nå. Vent litt...</p>';
  } else {
    div.style.display = 'none';
  }
}

function velgKategoriSelv(navn) {
  apiGet('velgKategori', { lagId: teamId, navn: navn }).then(visOpprykkLag).catch(function(e) { alert('Feil: ' + (e && e.message ? e.message : e)); });
}

init();
if (teamId) {
  sjekkBuzzerModus();
  setInterval(sjekkBuzzerModus, 5000);
  lastOpprykkLag();
  setInterval(lastOpprykkLag, 1500);
}
</script>
</body>
</html>
