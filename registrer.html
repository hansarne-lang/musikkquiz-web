<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Musikkquiz - Meld på laget</title>
<style>
:root{
  --bg:#000000;
  --accent:#00ffff;
  --accent2:#ffff00;
  --card:#000000;
  --text:#ffffff;
}
* {box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--bg);font-family:'Courier New',Courier,monospace;color:var(--text);letter-spacing:0.5px;}
h1,h2,h3{font-weight:700;margin:0 0 12px;text-transform:uppercase;letter-spacing:1px;}
h1{color:#ffff00;background:#0000aa;padding:8px 14px;display:inline-block;border:2px solid #ffffff;}
h2{color:#00ffff;}
.wrap{max-width:480px;margin:0 auto;padding:24px 16px 60px;}
.card{background:var(--card);border:2px solid var(--accent);border-radius:0;padding:20px;margin-bottom:20px;}
input{background:#000000;border:2px solid var(--accent2);color:var(--text);border-radius:0;padding:10px 12px;font-size:16px;font-family:'Courier New',Courier,monospace;width:100%;}
button{background:var(--accent2);border:2px solid #ffffff;color:#000000;font-weight:700;padding:14px 20px;border-radius:0;cursor:pointer;font-size:16px;font-family:'Courier New',Courier,monospace;text-transform:uppercase;width:100%;margin-top:12px;}
button:hover{background:#00ff00;}
button:disabled{background:#666;color:#ccc;cursor:default;}
label{display:inline-block;margin-top:6px;font-size:0.9em;color:#00ffff;}
.ok{color:#00ff00;font-weight:700;}
.err{color:#ff6b6b;font-weight:700;}
.small{font-size:0.85em;opacity:0.75;}
</style>
<link rel="stylesheet" href="meny.css">
<script src="meny.js" defer></script>
</head>
<body data-meny="lag">
<div class="wrap">
<h1>Musikkquiz</h1>
<div class="card">
<h2>Meld på laget ditt</h2>
<div id="app"><p>Sjekker om påmelding er åpen...</p></div>
</div>
</div>
<script>
var API_BASE = "https://script.google.com/macros/s/AKfycbzrbI15cIHxU_ccXhcriPwGwuksnPs2K5DDPTCHxhVrur-vU3KEpIiGbPnazh-K6i0rzQ/exec";

function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function apiGet(action, params) {
  var url = API_BASE + "?api=" + action;
  if (params) {
    Object.keys(params).forEach(function(k) {
      url += "&" + k + "=" + encodeURIComponent(params[k]);
    });
  }
  return fetch(url).then(function(res) { return res.json(); }).then(function(data) {
    if (data && data.error) { throw new Error(data.error); }
    return data;
  });
}

function visSkjema() {
  var html = '<label>Lagnavn</label><br>';
  html += '<input id="navnInput" maxlength="60" placeholder="Skriv inn lagnavnet deres" autofocus>';
  html += '<button id="meldPaKnapp" onclick="meldPa()">Meld på</button>';
  html += '<div id="status" style="margin-top:14px;"></div>';
  document.getElementById('app').innerHTML = html;
  var inp = document.getElementById('navnInput');
  inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') meldPa(); });
}

function meldPa() {
  var inp = document.getElementById('navnInput');
  var knapp = document.getElementById('meldPaKnapp');
  // Enter-lytteren gaar utenom knappen. Uten denne vakten gir tre raske
  // Enter-trykk tre paameldinger av samme lag paa treg backend (AVVIK-016).
  if (knapp.disabled) { return; }
  var navn = inp.value.trim();
  var statusDiv = document.getElementById('status');
  if (!navn) { statusDiv.innerHTML = '<p class="err">Skriv inn et lagnavn først.</p>'; return; }
  knapp.disabled = true;
  inp.disabled = true;
  statusDiv.innerHTML = '<p>Melder på...</p>';
  apiGet('registrerLagSelv', { navn: navn }).then(function (lag) {
    var svar = '<p class="ok">' + escHtml(lag.navn) + ' er påmeldt!</p><p class="small">Divisjon ' + escHtml(lag.divisjon) + ' - Bord ' + escHtml(lag.bord) + '</p>';
    // Har backend gitt oss lag-id-en, slipper laget aa vente paa en utdelt QR-kode (AVVIK-021).
    if (lag.id) {
      var lenke = location.href.replace(/registrer\.html.*$/, '') + 'lag.html?id=' + encodeURIComponent(lag.id);
      svar += '<p class="small">Svarsiden deres:</p><p><a href="' + escHtml(lenke) + '" style="color:#00ff00;word-break:break-all;">' + escHtml(lenke) + '</a></p>';
      svar += '<p class="small">Lagre denne lenken - det er her dere sender inn svarene.</p>';
    } else {
      svar += '<p class="small">Vis dette til en arrangør, eller vent til dere blir ropt opp / får utdelt bordnummer.</p>';
    }
    statusDiv.innerHTML = svar;
    inp.value = '';
    // Laget er paameldt - skjemaet skal ikke invitere til en ny paamelding.
    inp.disabled = true;
    knapp.style.display = 'none';
  }).catch(function (e) {
    statusDiv.innerHTML = '<p class="err">Feil: ' + escHtml(e && e.message ? e.message : e) + '</p>';
    knapp.disabled = false;
    inp.disabled = false;
  });
}

// Skjemaet skal dukke opp av seg selv naar arrangoren aapner paameldingen.
// Uten dette staar siden doed for alle som skannet QR-koden for tidlig (AVVIK-020).
var statusPoll = null;
var skjemaVist = false;

function init() {
  apiGet('paameldingStatus').then(function (s) {
    if (s.status === 'apen') {
      if (!skjemaVist) { skjemaVist = true; visSkjema(); }
      if (statusPoll) { clearInterval(statusPoll); statusPoll = null; }
    } else if (!skjemaVist) {
      document.getElementById('app').innerHTML = '<p class="err">Påmelding er ikke åpen akkurat nå.</p><p class="small">Spør en arrangør om å starte selvregistreringen. Denne siden åpner seg selv når påmeldingen starter - la den ligge åpen.</p>';
    }
  }).catch(function (e) {
    if (!skjemaVist) {
      document.getElementById('app').innerHTML = '<p class="err">Klarte ikke å sjekke påmeldingsstatus: ' + escHtml(e && e.message ? e.message : e) + '</p><p class="small">Prøver igjen om noen sekunder.</p>';
    }
  });
}

init();
statusPoll = setInterval(init, 5000);
</script>
</body>
</html>
